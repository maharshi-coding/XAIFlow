[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"
filterwarnings = [
  "ignore:.*The `disp` and `iprint` options.*:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = [".venv", "frontend/node_modules", ".local"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
